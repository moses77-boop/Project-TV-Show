<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Precious Moses (moses77-boop)</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <header>
      <h1>TV Show Episodes</h1>
    </header>
    <section class="controls" aria-label="Episode controls">
      <label for="episode-select">Jump to episode</label>
      <select id="episode-select"></select>
      <label for="search-input">Search episodes</label>
      <input id="search-input" type="search" placeholder="Name or summary" />
      <p id="match-count" aria-live="polite"></p>
    </section>
    <main id="root"></main>

    <footer>
      <p>
        Data originally from
        <a href="https://www.tvmaze.com/">TVMaze.com</a>
      </p>
    </footer>
    <!-- Loads a provided function called getAllEpisodes() which returns all episodes -->
    <script src="episodes.js"></script>

    <!-- Loads YOUR javascript code -->
    <script src="script.js"></script>
  </body>
</html>
